services:
  postgres:
    image: postgres:16-alpine
    container_name: follon-postgres
    environment:
      POSTGRES_DB: follon
      POSTGRES_USER: follon
      POSTGRES_PASSWORD: follon
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U follon -d follon"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  follon-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: follon-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/follon
      SPRING_DATASOURCE_USERNAME: follon
      SPRING_DATASOURCE_PASSWORD: follon
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_SQL_INIT_MODE: always
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
    restart: unless-stopped

volumes:
  postgres_data:
